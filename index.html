<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎰 Vietlott AI</title>
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#293548;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--mega:#f59e0b;--power:#3b82f6;
  --accent:#10b981;--red:#ef4444;--orange:#f97316;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:14px 16px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.header h1{font-size:1.25rem;font-weight:800}
.header-sub{color:var(--muted);font-size:.7rem;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--accent)}
.dot.err{background:var(--red)}
.dot.loading{background:var(--mega);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:10px 4px;text-align:center;cursor:pointer;font-size:.7rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;min-width:68px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:disabled{opacity:.4;pointer-events:none}
.content{padding:12px;max-width:500px;margin:0 auto}
.page{display:none}.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:.78rem;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.type-sel{display:flex;gap:8px;margin-bottom:12px}
.type-btn{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);transition:all .2s}
.type-btn.mega.active{border-color:var(--mega);color:var(--mega);background:rgba(245,158,11,.1)}
.type-btn.power.active{border-color:var(--power);color:var(--power);background:rgba(59,130,246,.1)}
.btn{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;font-size:.9rem;font-weight:700;transition:all .2s;margin-top:4px}
.btn-green{background:linear-gradient(135deg,var(--accent),#059669);color:#fff}
.btn-blue{background:linear-gradient(135deg,var(--power),#2563eb);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.balls{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ball{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;flex-shrink:0}
.mb{background:radial-gradient(circle at 35% 35%,#fcd34d,#d97706);color:#000;box-shadow:0 2px 8px rgba(245,158,11,.4)}
.pb{background:radial-gradient(circle at 35% 35%,#93c5fd,#2563eb);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.4)}
.bb{background:radial-gradient(circle at 35% 35%,#f9a8d4,#be185d);color:#fff;box-shadow:0 2px 8px rgba(190,24,93,.4)}
.ticket{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.loading-full{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;color:var(--muted);font-size:.9rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.spinner-sm{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.info{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:10px;font-size:.76rem;color:var(--accent);margin-bottom:10px;line-height:1.6}
.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:10px;font-size:.76rem;color:var(--mega);margin-bottom:10px;line-height:1.6}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;font-size:.8rem;color:var(--red);margin-bottom:10px;line-height:1.6}
select{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;margin-bottom:10px}
.bar{height:5px;border-radius:3px;background:var(--border);margin-top:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.rrow{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rdate{font-size:.7rem;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0}
.psi-box{border-radius:10px;padding:14px;margin-bottom:12px}
.psi-score{font-size:2.4rem;font-weight:900}
.psi-label{font-size:.82rem;font-weight:700;margin-top:3px}
.psi-action{font-size:.76rem;margin-top:8px;line-height:1.5;text-align:left}
.psi-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.7rem;color:var(--muted)}
.refresh-row{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:8px}
.refresh-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:.7rem}
.refresh-btn:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<div class="header">
  <h1>🎰 Vietlott AI</h1>
  <div class="header-sub">
    <span class="dot loading" id="status-dot"></span>
    <span id="status-txt">Đang tải dữ liệu...</span>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" onclick="showPage('gen',this)">🎯 Sinh số</div>
  <div class="tab" onclick="showPage('stats',this)">📊 Thống kê</div>
  <div class="tab" onclick="showPage('recent',this)">📋 Kết quả</div>
  <div class="tab" onclick="showPage('rank',this)">🏆 Xếp hạng</div>
</div>

<div class="content">

<!-- GEN -->
<div class="page active" id="page-gen">
  <div id="gen-loading" class="loading-full">
    <div class="spinner"></div>
    <div>Đang tải dữ liệu từ GitHub...</div>
  </div>
  <div id="gen-body" style="display:none">
    <div class="card">
      <div class="card-title">Loại vé</div>
      <div class="type-sel">
        <button class="type-btn mega active" onclick="setType('mega_645',this,'gen')">🟡 Mega 6/45</button>
        <button class="type-btn power" onclick="setType('power_655',this,'gen')">🔵 Power 6/55</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Chỉ số PSI</div>
      <div id="psi-display"><div style="color:var(--muted);font-size:.82rem">Nhấn nút bên dưới để bắt đầu</div></div>
    </div>
    <div class="card">
      <div class="card-title">Số lượng vé</div>
      <select id="ticket-count"><option value="5">5 vé</option><option value="10" selected>10 vé</option><option value="15">15 vé</option><option value="20">20 vé</option></select>
      <button class="btn btn-green" id="gen-btn" onclick="generateTickets()">🤖 Phân tích & Sinh số AI</button>
    </div>
    <div id="tickets-output"></div>
  </div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <div id="stats-loading" class="loading-full"><div class="spinner"></div><div>Đang tải...</div></div>
  <div id="stats-body" style="display:none">
    <div class="card">
      <div class="type-sel">
        <button class="type-btn mega active" onclick="setType('mega_645',this,'stats')">🟡 Mega 6/45</button>
        <button class="type-btn power" onclick="setType('power_655',this,'stats')">🔵 Power 6/55</button>
      </div>
      <select id="stats-view" onchange="renderStats()">
        <option value="general">Tất cả số — tần suất</option>
        <option value="hot">Top 10 HOT nhất</option>
        <option value="cold">Top 10 LẠNH nhất</option>
        <option value="missing">Vắng mặt lâu nhất</option>
      </select>
    </div>
    <div id="stats-output"></div>
  </div>
</div>

<!-- RECENT -->
<div class="page" id="page-recent">
  <div id="recent-loading" class="loading-full"><div class="spinner"></div><div>Đang tải...</div></div>
  <div id="recent-body" style="display:none">
    <div class="card">
      <div class="refresh-row">
        <span id="recent-updated">—</span>
        <button class="refresh-btn" onclick="refreshData()">↻ Tải lại</button>
      </div>
      <div class="type-sel">
        <button class="type-btn mega active" onclick="setType('mega_645',this,'recent')">🟡 Mega 6/45</button>
        <button class="type-btn power" onclick="setType('power_655',this,'recent')">🔵 Power 6/55</button>
      </div>
    </div>
    <div id="recent-output"></div>
  </div>
</div>

<!-- RANK -->
<div class="page" id="page-rank">
  <div id="rank-loading" class="loading-full"><div class="spinner"></div><div>Đang tải...</div></div>
  <div id="rank-body" style="display:none">
    <div class="card">
      <div class="type-sel">
        <button class="type-btn mega active" onclick="setType('mega_645',this,'rank')">🟡 Mega 6/45</button>
        <button class="type-btn power" onclick="setType('power_655',this,'rank')">🔵 Power 6/55</button>
      </div>
      <div class="warn">⚠️ Dựa trên thống kê lịch sử, không phải dự báo xác suất.</div>
      <button class="btn btn-green" onclick="renderRanking()">🏆 Tính bảng xếp hạng</button>
    </div>
    <div id="rank-output"></div>
  </div>
</div>

</div><!-- /content -->

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG — CHỈ CẦN ĐỔI DÒNG NÀY KHI BẠN TẠO REPO GITHUB
// ═══════════════════════════════════════════════════════════
const GITHUB_USER = 'hoanglehuy177-bet';   // ← ĐỔI
const GITHUB_REPO = 'vietlott-data';          // ← ĐỔI nếu tên repo khác
const GITHUB_BRANCH = 'main';
const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/data/vietlott_data.json`;

// ═══════════════════════════════════════════════════════════
const CFG = {
  mega_645:{name:'Mega 6/45',max:45,count:6,hasBonus:false},
  power_655:{name:'Power 6/55',max:55,count:6,hasBonus:true}
};

let DATA = [];
let dataLoaded = false;
let loadedAt = null;
let genType='mega_645', statsType='mega_645', recentType='mega_645', rankType='mega_645';

// ─── LOAD DATA ───────────────────────────────────────────
async function loadData(force=false){
  if(dataLoaded && !force) return true;
  setStatus('loading','Đang tải dữ liệu...');
  try{
    const cacheBust = force ? '?t='+Date.now() : '';
    const r = await fetch(DATA_URL + cacheBust);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const raw = await r.json();
    // Chuẩn hóa format
    DATA = raw.map(rec=>({
      n: rec.main_numbers || [],
      t: rec.vietlott_type || '',
      b: rec.bonus_number || '',
      d: rec.date || '',
      jp: rec.jackpot_value || 0,
      w: rec.winners || 0,
      g3: rec.winners_g3 || 0,
      jp2: rec.jackpot2_value || 0,
      w2: rec.winners_jp2 || 0,
    })).filter(r=>r.n.length===6 && r.d && r.t);

    dataLoaded = true;
    loadedAt = new Date();
    const mega = getLatest('mega_645'), power = getLatest('power_655');
    const latestDate = [mega,power].filter(Boolean).sort().reverse()[0]||'—';
    setStatus('ok', `${DATA.length} kỳ · Mới nhất: ${latestDate}`);
    showAllBodies();
    return true;
  } catch(e){
    setStatus('err','Lỗi tải data: '+e.message);
    showErrBodies(e.message);
    return false;
  }
}

function setStatus(state, txt){
  const dot = document.getElementById('status-dot');
  document.getElementById('status-txt').textContent = txt;
  dot.className = 'dot ' + (state==='ok'?'ok':state==='err'?'err':'loading');
}

function showAllBodies(){
  ['gen','stats','recent','rank'].forEach(p=>{
    const ld=document.getElementById(p+'-loading');
    const bd=document.getElementById(p+'-body');
    if(ld) ld.style.display='none';
    if(bd) bd.style.display='block';
  });
  // Update recent info
  const mega=getLatest('mega_645'), power=getLatest('power_655');
  const el=document.getElementById('recent-updated');
  if(el) el.textContent = `Mega: ${mega||'—'} · Power: ${power||'—'}`;
  renderRecent();
}

function showErrBodies(msg){
  ['gen','stats','recent','rank'].forEach(p=>{
    const ld=document.getElementById(p+'-loading');
    if(ld) ld.innerHTML=`<div class="err-box">
      ❌ Không tải được dữ liệu.<br>
      <strong>${msg}</strong><br><br>
      Kiểm tra:<br>
      1. Đã tạo GitHub repo chưa?<br>
      2. Đã đổi GITHUB_USER trong app chưa?<br>
      3. File data/vietlott_data.json đã có trong repo chưa?
      <br><br>
      <button class="btn btn-blue" onclick="refreshData()" style="margin-top:8px">↻ Thử lại</button>
    </div>`;
  });
}

async function refreshData(){
  dataLoaded = false;
  ['gen','stats','recent','rank'].forEach(p=>{
    const ld=document.getElementById(p+'-loading');
    const bd=document.getElementById(p+'-body');
    if(ld){ld.style.display='flex';ld.innerHTML='<div class="spinner"></div><div>Đang tải lại...</div>';}
    if(bd) bd.style.display='none';
  });
  await loadData(true);
}

// ─── HELPERS ─────────────────────────────────────────────
function getDraws(t){ return DATA.filter(r=>r.t===t).sort((a,b)=>a.d.localeCompare(b.d)); }
function getLatest(t){ const d=getDraws(t); return d.length?d[d.length-1].d:null; }

// ─── NAV ─────────────────────────────────────────────────
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id==='stats'&&dataLoaded) renderStats();
}

function setType(t,btn,ctx){
  if(ctx==='gen'){genType=t;document.getElementById('psi-display').innerHTML='<div style="color:var(--muted);font-size:.82rem">Nhấn nút để phân tích</div>';document.getElementById('tickets-output').innerHTML='';}
  if(ctx==='stats'){statsType=t;if(dataLoaded)renderStats();}
  if(ctx==='recent'){recentType=t;if(dataLoaded)renderRecent();}
  if(ctx==='rank'){rankType=t;document.getElementById('rank-output').innerHTML='';}
  btn.closest('.type-sel').querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ─── STATS ENGINE ────────────────────────────────────────
function computeStats(vtype){
  const draws=getDraws(vtype), cfg=CFG[vtype];
  const counter={}, lastSeen={};
  draws.forEach((r,i)=>{r.n.forEach(n=>{counter[n]=(counter[n]||0)+1;lastSeen[n]=i;});});
  const total=draws.length, nums=[];
  for(let i=1;i<=cfg.max;i++){
    const n=String(i).padStart(2,'0');
    const cnt=counter[n]||0, li=lastSeen[n]!==undefined?lastSeen[n]:-1;
    const miss=li>=0?total-li-1:total, ld=li>=0?draws[li].d:'—';
    nums.push({n,cnt,miss,ld,rate:cnt/total});
  }
  return{nums,total,draws};
}

function computePSI(vtype){
  const draws=getDraws(vtype);
  if(draws.length<5) return{score:0,level:'XANH',buy:2,action:'Chưa đủ dữ liệu.',color:'#10b981',g1:0,g2:0,g3:0,g4:0,g5:0,g6:0};
  const isM=vtype==='mega_645', mult=isM?45:79, jpBig=isM?80e9:120e9;
  const latest=draws[draws.length-1];
  const latestJP=latest.jp||0;
  let g1=0;
  if(latest.g3>0){
    const estR=latest.g3*mult*10000;
    const past=draws.slice(-6,-1).map(d=>d.g3||0).filter(v=>v>0);
    const avg=past.length?past.reduce((a,b)=>a+b,0)/past.length*mult*10000:estR;
    const fomo=estR/avg;
    g1=latestJP>=jpBig&&fomo>=1.3?20:latestJP>=jpBig*.75&&fomo>=1.15?13:latestJP>=jpBig*.5?7:2;
  }
  const jpD=draws.filter(d=>d.w>0||(d.w2||0)>0), rec=jpD.slice(-10);
  let g2=0;
  if(rec.length>0){const r=rec.filter(d=>crowdScore(d.n,vtype)>=90).length/rec.length;g2=r>=.7?15:r>=.5?9:r>=.3?5:1;}
  let g3=0;
  if(rec.length>0){const r=rec.filter(d=>(d.w+(d.w2||0))===1).length/rec.length;g3=r>=.8?15:r>=.6?11:r>=.4?6:2;}
  let g4=0,lastJI=-1;
  for(let i=draws.length-1;i>=0;i--){if(draws[i].w>0){lastJI=i;break;}}
  if(lastJI>=0){
    const gross=draws.slice(lastJI+1).reduce((s,d)=>s+(d.g3||0)*mult*10000,0);
    const pjp=draws[lastJI].jp||0;
    g4=gross>=pjp?20:gross>=pjp*.7?15:gross>=pjp*.4?7:2;
  }
  const dS=draws.length-lastJI-1, avgC=isM?10:15;
  const g5=dS>=avgC*1.5?15:dS>=avgC?10:3;
  const g6=latestJP>(isM?50e9:80e9)?15:5;
  const score=Math.min(100,g1+g2+g3+g4+g5+g6);
  let level,buy,action,color;
  if(score>=70){level='ĐỎ';buy=5;color='#ef4444';action='🔴 BÁO ĐỘNG JACKPOT: PSI cao bất thường.\nCHIẾN THUẬT: ALL-IN — Nên mua nhiều vé dị thường.';}
  else if(score>=45){level='CAM';buy=3;color='#f97316';action='🟠 CHUYỂN PHA: Tín hiệu trung bình.\nCHIẾN THUẬT: THĂM DÒ — Mua thăm dò 3 vé.';}
  else{level='XANH';buy=2;color='#10b981';action='🟢 AN TOÀN: PSI thấp, dòng tiền bình ổn.\nCHIẾN THUẬT: DU KÍCH — Chờ đợi, mua tối thiểu.';}
  return{score,level,buy,action,color,g1,g2,g3,g4,g5,g6};
}

function crowdScore(nums,vtype){
  const K=CFG[vtype].max;
  if(!nums||nums.length<6)return 0;
  const ns=nums.map(n=>parseInt(n)).sort((a,b)=>a-b);
  const gaps=[];for(let i=1;i<6;i++)gaps.push(ns[i]-ns[i-1]);
  const mx=Math.max(...gaps),mn=Math.min(...gaps);
  const gS=(mx-mn)>15?30:(mx-mn)>8?15:5;
  const sum=ns.reduce((a,b)=>a+b,0);
  const dS=Math.abs(sum-(K===45?135:168));
  const sS=dS>60?30:dS>30?15:5;
  const ev=ns.filter(n=>n%2===0).length;
  const pS=ev>=5||ev<=1?20:ev>=4||ev<=2?10:5;
  const dec=new Set(ns.map(n=>Math.floor(n/10)));
  const dSc=dec.size<=2?20:dec.size<=3?10:5;
  return Math.min(100,gS+sS+pS+dSc);
}

// ─── GEN ─────────────────────────────────────────────────
async function generateTickets(){
  if(!dataLoaded){await loadData();if(!dataLoaded)return;}
  const btn=document.getElementById('gen-btn');
  const count=parseInt(document.getElementById('ticket-count').value);
  btn.disabled=true; btn.textContent='⏳ Đang tính PSI...';
  document.getElementById('psi-display').innerHTML='<div style="display:flex;align-items:center;gap:8px;color:var(--muted)"><div class="spinner-sm"></div> Đang tính chỉ số PSI...</div>';
  document.getElementById('tickets-output').innerHTML='';
  await new Promise(r=>setTimeout(r,30));
  const psi=computePSI(genType);
  renderPSI(psi);
  btn.textContent='⏳ Đang sinh vé...';
  await new Promise(r=>setTimeout(r,30));
  renderTickets(genTickets(genType,count,psi),genType);
  btn.disabled=false; btn.textContent='🤖 Phân tích & Sinh số AI';
}

function genTickets(vtype,count,psi){
  const cfg=CFG[vtype], draws=getDraws(vtype);
  const poolSz=vtype==='mega_645'?36:45;
  const jpD=draws.filter(d=>d.w>0), tgt=jpD.slice(-25);
  const weights={};
  if(!tgt.length){for(let i=1;i<=cfg.max;i++)weights[i]=1;}
  else tgt.forEach((d,i)=>{const dec=Math.pow(.95,tgt.length-1-i);d.n.forEach(n=>{const ni=parseInt(n);weights[ni]=(weights[ni]||0)+(psi.level==='ĐỎ'?2:1.5)*dec;});});
  const sorted=Object.entries(weights).sort((a,b)=>b[1]-a[1]);
  let pool=sorted.slice(0,poolSz).map(e=>parseInt(e[0]));
  if(pool.length<poolSz){for(let i=1;i<=cfg.max&&pool.length<poolSz;i++){if(!pool.includes(i))pool.push(i);}}
  pool.sort((a,b)=>a-b);
  const tickets=[],seen=new Set();
  let att=0;
  while(tickets.length<count&&att<count*200){
    att++;
    const nums=[],av=[...pool];
    for(let i=0;i<6;i++){const idx=Math.floor(Math.pow(Math.random(),1.5)*av.length);nums.push(av[idx]);av.splice(idx,1);}
    nums.sort((a,b)=>a-b);
    const key=nums.join('-');
    if(seen.has(key))continue; seen.add(key);
    const nS=nums.map(n=>String(n).padStart(2,'0'));
    const cr=crowdScore(nS,vtype);
    const wW=psi.level==='ĐỎ';
    if(wW&&cr<70&&Math.random()<.6)continue;
    if(!wW&&cr>90&&Math.random()<.5)continue;
    tickets.push({nums:nS,sum:nums.reduce((a,b)=>a+b,0),ev:nums.filter(n=>n%2===0).length,cr,type:cr>=90?'🌟 Dị thường':'🤝 Phổ thông'});
  }
  return tickets;
}

function renderPSI(psi){
  const bgM={'ĐỎ':'rgba(239,68,68,.15)','CAM':'rgba(249,115,22,.15)','XANH':'rgba(16,185,129,.15)'};
  const bdM={'ĐỎ':'rgba(239,68,68,.5)','CAM':'rgba(249,115,22,.5)','XANH':'rgba(16,185,129,.5)'};
  document.getElementById('psi-display').innerHTML=`
    <div class="psi-box" style="background:${bgM[psi.level]};border:1px solid ${bdM[psi.level]}">
      <div class="psi-score" style="color:${psi.color}">${psi.score}</div>
      <div class="psi-label" style="color:${psi.color}">/100 PSI · ${psi.level} · Nên mua ${psi.buy} vé</div>
      <div class="psi-action" style="color:${psi.color}">${psi.action.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="psi-grid">
      <span>📦 Volume: ${psi.g1}đ</span><span>🎲 Weirdness: ${psi.g2}đ</span>
      <span>👤 Độc bản: ${psi.g3}đ</span><span>💰 Margin: ${psi.g4}đ</span>
      <span>⏱ Chu kỳ: ${psi.g5}đ</span><span>📈 JP size: ${psi.g6}đ</span>
    </div>`;
}

function renderTickets(tickets,vtype){
  if(!tickets.length){document.getElementById('tickets-output').innerHTML='<div class="card" style="text-align:center;color:var(--muted)">Không sinh được vé. Thử lại!</div>';return;}
  const iM=vtype==='mega_645';
  let h=`<div class="card"><div class="card-title">${tickets.length} vé đề xuất</div>`;
  tickets.forEach((t,i)=>{
    h+=`<div class="ticket"><div style="font-size:.74rem;color:var(--muted);margin-bottom:5px">Vé #${i+1} · ${t.type}</div><div class="balls">`;
    t.nums.forEach(n=>{h+=`<div class="ball ${iM?'mb':'pb'}">${n}</div>`;});
    h+=`</div><div style="font-size:.7rem;color:var(--muted);margin-top:4px">Tổng: ${t.sum} · C/L: ${t.ev}/${6-t.ev} · Dị: ${t.cr}đ</div></div>`;
  });
  h+='</div>';
  document.getElementById('tickets-output').innerHTML=h;
}

// ─── STATS ───────────────────────────────────────────────
function renderStats(){
  const view=document.getElementById('stats-view').value;
  const {nums,total}=computeStats(statsType);
  const iM=statsType==='mega_645';
  let sorted;
  if(view==='general') sorted=[...nums].sort((a,b)=>parseInt(a.n)-parseInt(b.n));
  else if(view==='hot') sorted=[...nums].sort((a,b)=>b.cnt-a.cnt).slice(0,10);
  else if(view==='cold') sorted=[...nums].sort((a,b)=>a.cnt-b.cnt).slice(0,10);
  else sorted=[...nums].sort((a,b)=>b.miss-a.miss).slice(0,15);
  const mx=Math.max(...nums.map(n=>n.cnt)), exp=total*6/CFG[statsType].max;
  let h='';
  sorted.forEach(n=>{
    const pct=(n.cnt/mx*100).toFixed(0);
    const badge=n.cnt>exp*1.1?'<span style="font-size:.66rem;padding:1px 6px;border-radius:20px;background:rgba(239,68,68,.2);color:#ef4444">HOT</span>':
      n.cnt<exp*.9?'<span style="font-size:.66rem;padding:1px 6px;border-radius:20px;background:rgba(59,130,246,.2);color:#3b82f6">LẠNH</span>':
      '<span style="font-size:.66rem;padding:1px 6px;border-radius:20px;background:rgba(148,163,184,.2);color:#94a3b8">BT</span>';
    h+=`<div class="card" style="padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="ball ${iM?'mb':'pb'}" style="flex-shrink:0">${n.n}</div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${n.cnt} lần</span>${badge}</div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${iM?'var(--mega)':'var(--power)'}"></div></div>
          <div style="font-size:.68rem;color:var(--muted);margin-top:2px">Cuối: ${n.ld} · Vắng ${n.miss} kỳ</div>
        </div>
      </div></div>`;
  });
  document.getElementById('stats-output').innerHTML=h||'<div style="color:var(--muted)">Không có dữ liệu</div>';
}

// ─── RECENT ──────────────────────────────────────────────
function renderRecent(){
  const draws=getDraws(recentType).reverse().slice(0,30);
  const iM=recentType==='mega_645';
  let h='';
  draws.forEach(d=>{
    const jp=(d.jp/1e9).toFixed(1), hasW=d.w>0;
    h+=`<div class="rrow"><div class="rdate"><span>${d.d}</span><span style="color:${hasW?'var(--accent)':'var(--muted)'}">
      ${hasW?'🏆 '+d.w+' người trúng':'JP: '+jp+'tỷ'}</span></div><div class="balls">`;
    d.n.forEach(n=>{h+=`<div class="ball ${iM?'mb':'pb'}" style="width:32px;height:32px;font-size:.76rem">${n}</div>`;});
    if(d.b&&d.b!==''){h+=`<span style="color:var(--muted);font-size:.7rem;align-self:center">+</span><div class="ball bb" style="width:32px;height:32px;font-size:.76rem">${d.b}</div>`;}
    h+='</div></div>';
  });
  document.getElementById('recent-output').innerHTML=h||'<div style="color:var(--muted);padding:20px;text-align:center">Không có dữ liệu</div>';
}

// ─── RANKING ─────────────────────────────────────────────
function renderRanking(){
  document.getElementById('rank-output').innerHTML='<div style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto"></div></div>';
  setTimeout(()=>{
    const {nums,total}=computeStats(rankType);
    const iM=rankType==='mega_645', exp=total*6/CFG[rankType].max;
    const sc=nums.map(n=>({...n,score:Math.min(100,(n.cnt/exp*50+Math.max(0,50-n.miss*2))/2)})).sort((a,b)=>b.score-a.score).slice(0,20);
    const gc=['#ffd700','#c0c0c0','#cd7f32'];
    let h='<div class="card"><div class="card-title">Top 20 số tổng hợp</div>';
    sc.forEach((n,i)=>{
      const c=i<3?gc[i]:(iM?'#f59e0b':'#3b82f6');
      h+=`<div class="rank-item">
        <div class="rank-n" style="background:${c}20;color:${c}">${i+1}</div>
        <div class="ball ${iM?'mb':'pb'}" style="width:32px;height:32px;font-size:.76rem">${n.n}</div>
        <div style="flex:1"><div style="font-size:.78rem">${n.cnt} lần · Vắng ${n.miss} kỳ</div>
          <div class="bar"><div class="bar-fill" style="width:${n.score}%;background:${c}"></div></div></div>
        <div style="font-size:.76rem;color:var(--muted)">${n.score.toFixed(0)}đ</div>
      </div>`;
    });
    h+='</div>';
    document.getElementById('rank-output').innerHTML=h;
  },80);
}
